; ═══════════════════════════════════════════════════════════════════════════
; LILYGO T-LoRa Pager
; MCU  : ESP32-S3 (16 MB Flash, 8 MB PSRAM)
; Radio: SX1262 (primary) | LR1121 (alternate)
; Display: 2.33" ST7796, 480×222 (landscape, driven via LovyanGFX / LGFX)
; ═══════════════════════════════════════════════════════════════════════════

; ─── Shared base ────────────────────────────────────────────────────────────
[LilyGo_TLora_Pager_base]
extends     = esp32_base
board       = lilygo_tlora_pager
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

build_flags =
  ${esp32_base.build_flags}
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D BOARD_HAS_PSRAM=1
  -I variants/lilygo_tlora_pager

  ; ── I²C ──────────────────────────────────────────────────────────────
  -D PIN_BOARD_SDA=3
  -D PIN_BOARD_SCL=2

  ; ── LoRa (SX1262) – shared SPI bus (IO34/33/35) ─────────────────────
  -D P_LORA_MOSI=34
  -D P_LORA_MISO=33
  -D P_LORA_SCLK=35
  -D P_LORA_NSS=36        ; LoRa chip-select
  -D P_LORA_DIO_1=14      ; DIO1 / IRQ
  -D P_LORA_RESET=47
  -D P_LORA_BUSY=48

  ; ── SX1262 specific ──────────────────────────────────────────────────
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D LORA_TX_POWER=22

  ; ── GPS / sensors ────────────────────────────────────────────────────
  ; Enable the GPS-capable EnvironmentSensorManager constructor and loop.
  ; Other ENV_INCLUDE_* sensors are left off — the T-LoRa Pager only has
  ; the MIA-M10Q GNSS; it has no BME280 / INA219 / etc.
  -D ENV_INCLUDE_GPS=1

  ; ── User button (rotary encoder centre) ─────────────────────────────
  -D PIN_USER_BTN=7

  ; ── Display (ST7796 480×222 via LGFX) ───────────────────────────────
  ; LGFX uses SPI3_HOST (HSPI); RadioLib uses SPI2 (FSPI). Both share
  ; the same physical SPI pins (IO34/33/35) via separate CS lines:
  ;   LoRa CS=IO36  NFC CS=IO39  Display CS=IO38
  ; UI_ZOOM=3 → logical canvas = 160×74 px rendered full-screen at 3× zoom.
  -D UI_ZOOM=3
  -D DISPLAY_CLASS=TLoRaPagerDisplay

  ; ── External expansion socket ────────────────────────────────────────
  ; GPIO9 + UART TX=IO43 / RX=IO44 (not used by companion radio firmware)

build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/lilygo_tlora_pager>
  +<helpers/ui/LGFXDisplay.cpp>
  +<helpers/sensors/*.cpp>

lib_deps =
  ${esp32_base.lib_deps}
  lovyan03/LovyanGFX @ ^1.1.16
  stevemarple/MicroNMEA @ ^2.0.6

; ─── Repeater ───────────────────────────────────────────────────────────────
[env:LilyGo_TLora_Pager_repeater]
extends = LilyGo_TLora_Pager_base
build_src_filter =
  ${LilyGo_TLora_Pager_base.build_src_filter}
  +<../examples/simple_repeater>
build_flags =
  ${LilyGo_TLora_Pager_base.build_flags}
  -D ADVERT_NAME='"TLora Pager Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
lib_deps =
  ${LilyGo_TLora_Pager_base.lib_deps}
  ${esp32_ota.lib_deps}

; ─── Companion Radio – USB serial ───────────────────────────────────────────
; Connect via USB cable; the companion app sees a CDC serial port.
; Frame format: < LEN_LO LEN_HI payload  (app→radio)
;               > LEN_LO LEN_HI payload  (radio→app)
[env:LilyGo_TLora_Pager_companion_radio_usb]
extends = LilyGo_TLora_Pager_base
build_flags =
  ${LilyGo_TLora_Pager_base.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D ENABLE_PRIVATE_KEY_IMPORT=1
  -D ENABLE_PRIVATE_KEY_EXPORT=1
; -D MESH_PACKET_LOGGING=1   ; ← do NOT enable in production builds
; -D MESH_DEBUG=1
build_src_filter =
  ${LilyGo_TLora_Pager_base.build_src_filter}
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${LilyGo_TLora_Pager_base.lib_deps}
  densaugeo/base64 @ ~1.4.0

; ─── Companion Radio – Bluetooth LE (Nordic UART Service) ───────────────────
; The companion app connects to the "MeshCore" BLE device (Nordic UART Service).
; Default PIN: 123456  (change BLE_PIN_CODE before flashing for security).
; NUS service UUID : 6E400001-B5A3-F393-E0A9-E50E24DCCA9E
; RX characteristic: 6E400002  (app writes to radio)
; TX characteristic : 6E400003  (radio notifies app)
[env:LilyGo_TLora_Pager_companion_radio_ble]
extends = LilyGo_TLora_Pager_base
build_flags =
  ${LilyGo_TLora_Pager_base.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
  -D ENABLE_PRIVATE_KEY_IMPORT=1
  -D ENABLE_PRIVATE_KEY_EXPORT=1
; -D BLE_DEBUG_LOGGING=1
; -D MESH_PACKET_LOGGING=1   ; ← do NOT enable in production builds
; -D MESH_DEBUG=1
build_src_filter =
  ${LilyGo_TLora_Pager_base.build_src_filter}
  +<helpers/esp32/*.cpp>
  -<helpers/esp32/ESPNOWRadio.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${LilyGo_TLora_Pager_base.lib_deps}
  densaugeo/base64 @ ~1.4.0

; ─── Room Server ────────────────────────────────────────────────────────────
[env:LilyGo_TLora_Pager_room_server]
extends = LilyGo_TLora_Pager_base
build_src_filter =
  ${LilyGo_TLora_Pager_base.build_src_filter}
  +<../examples/simple_room_server>
build_flags =
  ${LilyGo_TLora_Pager_base.build_flags}
  -D ADVERT_NAME='"TLora Pager Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
lib_deps =
  ${LilyGo_TLora_Pager_base.lib_deps}
  ${esp32_ota.lib_deps}

; ═══════════════════════════════════════════════════════════════════════════
; LR1121 VARIANT
; Confirmed by LILYGO wiki: the LR1121 board uses IDENTICAL GPIO connections
; to the SX1262 board — only the radio chip differs.
;   LR1121 adds 2.4 GHz LoRa on top of the standard sub-1 GHz bands.
;
; The MeshCore codebase ships CustomLR1110 which covers the LR11x0 family
; (LR1110 / LR1120 / LR1121 all share the same RadioLib protocol layer —
; see src/helpers/radiolib/LR11x0Reset.h).  Using CustomLR1110 / Wrapper
; with LR1121 hardware should work; if RadioLib rejects the chip ID at
; startup, a one-line CustomLR1121.h inheriting from `LR1121` instead of
; `LR1110` is all that is needed.
; ═══════════════════════════════════════════════════════════════════════════

; ─── LR1121 shared base ─────────────────────────────────────────────────────
[LilyGo_TLora_Pager_lr1121_base]
extends = LilyGo_TLora_Pager_base
build_flags =
  ${LilyGo_TLora_Pager_base.build_flags}
  -U USE_SX1262
  -U RADIO_CLASS
  -U WRAPPER_CLASS
  -U SX126X_DIO2_AS_RF_SWITCH
  -U SX126X_DIO3_TCXO_VOLTAGE
  -U SX126X_CURRENT_LIMIT
  -U SX126X_RX_BOOSTED_GAIN
  -D USE_LR1110
  -D RADIO_CLASS=CustomLR1110
  -D WRAPPER_CLASS=CustomLR1110Wrapper
  -D LORA_TX_POWER=22
build_src_filter = ${LilyGo_TLora_Pager_base.build_src_filter}
  +<helpers/radiolib/RadioLibWrappers.cpp>
lib_deps = ${LilyGo_TLora_Pager_base.lib_deps}

; ─── LR1121 Companion Radio – BLE ───────────────────────────────────────────
[env:LilyGo_TLora_Pager_lr1121_companion_radio_ble]
extends = LilyGo_TLora_Pager_lr1121_base
build_flags =
  ${LilyGo_TLora_Pager_lr1121_base.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
  -D ENABLE_PRIVATE_KEY_IMPORT=1
  -D ENABLE_PRIVATE_KEY_EXPORT=1
build_src_filter =
  ${LilyGo_TLora_Pager_lr1121_base.build_src_filter}
  +<helpers/esp32/*.cpp>
  -<helpers/esp32/ESPNOWRadio.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${LilyGo_TLora_Pager_lr1121_base.lib_deps}
  densaugeo/base64 @ ~1.4.0

; ─── LR1121 Companion Radio – USB ───────────────────────────────────────────
[env:LilyGo_TLora_Pager_lr1121_companion_radio_usb]
extends = LilyGo_TLora_Pager_lr1121_base
build_flags =
  ${LilyGo_TLora_Pager_lr1121_base.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D ENABLE_PRIVATE_KEY_IMPORT=1
  -D ENABLE_PRIVATE_KEY_EXPORT=1
build_src_filter =
  ${LilyGo_TLora_Pager_lr1121_base.build_src_filter}
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${LilyGo_TLora_Pager_lr1121_base.lib_deps}
  densaugeo/base64 @ ~1.4.0

; ─── LR1121 Repeater ────────────────────────────────────────────────────────
[env:LilyGo_TLora_Pager_lr1121_repeater]
extends = LilyGo_TLora_Pager_lr1121_base
build_src_filter =
  ${LilyGo_TLora_Pager_lr1121_base.build_src_filter}
  +<../examples/simple_repeater>
build_flags =
  ${LilyGo_TLora_Pager_lr1121_base.build_flags}
  -D ADVERT_NAME='"TLora Pager LR1121 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
lib_deps =
  ${LilyGo_TLora_Pager_lr1121_base.lib_deps}
  ${esp32_ota.lib_deps}
